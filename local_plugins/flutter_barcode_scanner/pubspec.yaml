name: flutter_barcode_scanner
description: A Flutter plugin for scanning 2D barcodes and QR codes with proper namespace configuration for Android.
version: 2.0.0
homepage: https://github.com/AmolGangadhare/flutter_barcode_scanner

environment:
  sdk: ">=2.12.0 <4.0.0"
  flutter: ">=1.12.0"

flutter:
  plugin:
    platforms:
      android:
        package: com.amolg.flutterbarcodescanner
        pluginClass: FlutterBarcodeScannerPlugin
      ios:
        pluginClass: SwiftFlutterBarcodeScannerPlugin

dependencies:
  flutter:
    sdk: flutter