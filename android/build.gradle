allprojects {
    repositories {
        google()
        mavenCentral()
        maven { url 'https://jitpack.io' }  // Repositorio para me.dm7.barcodescanner:zxing:1.9.13
    }

    // Apply barcode scanner patch for namespace issue
    if (project.name != 'android') {
        rootProject.project(":app").afterEvaluate {
            def patchFile = new File(rootProject.projectDir, "barcode_scanner_patch.gradle")
            if (patchFile.exists()) {
                apply from: patchFile
            }
        }
    }
}

rootProject.buildDir = "../build"
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(":app")
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
