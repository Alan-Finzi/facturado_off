plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

// Run the plugin patch script before building
task applyPluginPatches(type: Exec) {
    workingDir '../'
    if (org.gradle.internal.os.OperatingSystem.current().isWindows()) {
        commandLine 'cmd', '/c', 'apply_plugin_patches.bat'
    } else {
        commandLine './apply_plugin_patches.sh'
    }
    ignoreExitValue true
}

preBuild.dependsOn applyPluginPatches

def localProperties = new Properties()
def localPropertiesFile = rootProject.file("local.properties")
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader("UTF-8") { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty("flutter.versionCode") ?: "1"
def flutterVersionName = localProperties.getProperty("flutter.versionName") ?: "1.0"

android {
    namespace "com.ultrix.facturador_offline"
    ndkVersion "25.1.8937393" // Actualizado para compatibilidad con plugins
    compileSdk 34

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    defaultConfig {
        applicationId "com.ultrix.facturador_offline"
        minSdk 30
        targetSdk 34
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
    }

    buildTypes {
        debug {
            // No obfuscation for debugging
            minifyEnabled false
            shrinkResources false
        }
        release {
            // Enable ProGuard for release builds
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.debug // En producción, usar signingConfigs.release

            // Habilitar multi-dex para apps grandes si es necesario
            multiDexEnabled true

            // Configuraciones adicionales para release
            ndk {
                abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86_64', 'x86'
            }
        }
    }

    // Configurar empaquetado split por ABI para optimizar tamaño de APK
    splits {
        abi {
            enable true
            reset()
            include 'armeabi-v7a', 'arm64-v8a', 'x86_64', 'x86'
            universalApk true
        }
    }
}

flutter {
    source "../.."
}
